spring.application.name=cybertrack

# The React frontend (Vite) runs on 5173 and forwards /api requests to this port.
server.port=8080

# schema.sql and data.sql are run at start-up (embedded H2 database).
spring.sql.init.encoding=UTF-8

# Origins allowed to call the API directly from a browser (comma-separated).
cybertrack.cors.allowed-origins=http://localhost:5173,http://localhost:4173
